services:
  bhoomix:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bhoomix-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - JWT_SECRET_KEY=bhoomix-secure-secret-key-change-in-production-2026-sih
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - MAX_UPLOAD_SIZE_MB=15
      - UPLOAD_DIR=/app/uploads/private
      # Optional: To connect to external MySQL or PostgreSQL, set DATABASE_URL below
      # DATABASE_URL=mysql+pymysql://user:pass@host:3306/bhoomix
    volumes:
      - bhoomix-uploads:/app/uploads/private
      - bhoomix-data:/app/data
    restart: unless-stopped

volumes:
  bhoomix-uploads:
    driver: local
  bhoomix-data:
    driver: local
